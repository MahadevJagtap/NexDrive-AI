<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1a" />
      <stop offset="100%" stop-color="#0e172e" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Navy Base Tile -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Radar Waves / Scanning Arcs -->
  <path d="M 6 10 A 11 11 0 0 1 26 10" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" opacity="0.75" filter="url(#glow)" />
  <path d="M 9.5 13 A 7 7 0 0 1 22.5 13" fill="none" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" />

  <!-- Road Boundaries (Converging Perspective Lanes) -->
  <path d="M 6 28 L 12.5 17" fill="none" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 26 28 L 19.5 17" fill="none" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" />

  <!-- Center Lane Markings (White Details) -->
  <line x1="16" y1="27" x2="16" y2="23" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <line x1="16" y1="19.5" x2="16" y2="17.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

  <!-- Radar Emitter / Sensor Beacon -->
  <circle cx="16" cy="15.5" r="2.2" fill="#ffffff" />
  <circle cx="16" cy="15.5" r="3.8" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.8" />
</svg>
