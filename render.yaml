services:
  - type: web
    name: nexdrive-ai
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python scripts/download_model.py"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"
    plan: free
    healthCheckPath: /health
